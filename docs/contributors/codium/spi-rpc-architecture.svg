<!-- LEGEND                                                            -->
<!-- ================================================================ -->

<rect x="22" y="754" width="506" height="68" rx="6"
      fill="#060e1c" stroke="#1a3050" stroke-width="1"/>
<text x="275" y="771" text-anchor="middle" font-size="10" font-weight="bold" fill="#607090">LEGEND</text>

<!-- Data path arrow -->
<line x1="40"  y1="788" x2="80"  y2="788"
      stroke="#4a82c8" stroke-width="1.5" marker-end="url(#ah-b)"/>
<text x="88" y="792" font-size="9" fill="#607090">Data path  (sk_buff)</text>

<!-- Management path arrow (dashed) -->
<line x1="205" y1="788" x2="245" y2="788"
      stroke="#4a82c8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#ah-b)"/>
<text x="253" y="792" font-size="9" fill="#607090">Management / RPC call</text>

<!-- SPI arrow -->
<line x1="380" y1="788" x2="420" y2="788"
      stroke="#c07818" stroke-width="2.5" marker-end="url(#ah-spi)"/>
<text x="428" y="792" font-size="9" fill="#607090">SPI frame</text>

<!-- IRQ arrow -->
<line x1="490" y1="788" x2="520" y2="788"
      stroke="#b83030" stroke-width="2" marker-end="url(#ah-irq)"/>
<text x="528" y="792" font-size="9" fill="#607090">IRQ</text>

<!-- Dashed box legend -->
<rect x="40" y="800" width="40" height="15" rx="3"
      fill="none" stroke="#607090" stroke-width="1" stroke-dasharray="3,2"/>
<text x="88" y="812" font-size="9" fill="#607090">Optional / pluggable component</text>

<!-- Zephyr legend repeat -->
<rect x="672" y="754" width="506" height="68" rx="6"
      fill="#04100a" stroke="#183028" stroke-width="1"/>
<text x="925" y="771" text-anchor="middle" font-size="10" font-weight="bold" fill="#407060">FRAME FORMAT  (512 bytes, fixed)</text>
<text x="925" y="788" text-anchor="middle" font-size="9" fill="#407060">[ MAGIC 1B ][ FLAGS 1B ][ MOD_ID 1B ][ PROC_ID 1B ][ SEQ 2B BE ][ PLEN 2B BE ]</text>
<text x="925" y="803" text-anchor="middle" font-size="9" fill="#407060">[ PAYLOAD up to 502 B ][ CRC-16/CCITT 2B ][ zero-pad to 512 B ]</text>
<text x="925" y="817" text-anchor="middle" font-size="9" fill="#2a5040">MAGIC=0xDE for data  ·  MAGIC=0x00 for NOOP  ·  FLAGS: RESPONSE | EVENT | ERROR</text>

</svg>
