<text x="799" y="96"  text-anchor="middle" font-size="13" font-weight="bold" fill="#d0f0e0">Radio Scheduler</text>
<text x="799" y="114" text-anchor="middle" font-size="10" fill="#80d0a0">schedule_tx / schedule_rx</text>
<text x="799" y="130" text-anchor="middle" font-size="10" fill="#80d0a0">cancel  ·  get_stats</text>
<text x="799" y="147" text-anchor="middle" font-size="9"  fill="#509870">LBT · HARQ · priority queue</text>

<!-- Other modules (dashed) -->
<rect x="928" y="70" width="244" height="112" rx="7"
      fill="#165830" stroke="#289050" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="1050" y="96"  text-anchor="middle" font-size="13" font-weight="bold" fill="#d0f0e0">Other Modules</text>
<text x="1050" y="114" text-anchor="middle" font-size="10" fill="#80d0a0">Spectrum Manager</text>
<text x="1050" y="130" text-anchor="middle" font-size="10" fill="#80d0a0">Assoc · Beacon · HARQ</text>
<text x="1050" y="147" text-anchor="middle" font-size="9"  fill="#509870">Security · Paging · Mobility</text>


<!-- ================================================================ -->
<!-- ZEPHYR — MODULE RPC HANDLERS                                      -->
<!-- ================================================================ -->

<rect x="672" y="216" width="506" height="90" rx="7"
      fill="#124820" stroke="#208040" stroke-width="2"/>
<text x="925" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#d0f0e0">Module RPC Handlers</text>
<text x="925" y="262" text-anchor="middle" font-size="11" fill="#80d0a0">opener_rpc_scheduler.c  ·  opener_rpc_spectrum.c  ·  ...</text>
<text x="925" y="282" text-anchor="middle" font-size="10" fill="#60b080">handle_schedule_tx()  ·  push_tx_complete_event()  ·  serialize / deserialize</text>


<!-- ================================================================ -->
<!-- ZEPHYR — RPC SERVER                                               -->
<!-- ================================================================ -->

<rect x="672" y="326" width="506" height="122" rx="7"
      fill="#0c3818" stroke="#186030" stroke-width="2"/>
<text x="925" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#d0f0e0">RPC Server / Dispatch</text>
<text x="925" y="373" text-anchor="middle" font-size="11" fill="#80d0a0">opener_rpc_server.c</text>
<text x="800" y="393" text-anchor="middle" font-size="10" fill="#60b080">handler registry</text>
<text x="925" y="393" text-anchor="middle" font-size="10" fill="#60b080">frame_build()</text>
<text x="1054" y="393" text-anchor="middle" font-size="10" fill="#60b080">crc16_ccitt()</text>
<text x="925" y="412" text-anchor="middle" font-size="10" fill="#449868">K_MSGQ_DEFINE(rpc_tx_queue,  512 B,  depth 8)</text>
<text x="925" y="430" text-anchor="middle" font-size="10" fill="#449868">K_THREAD_DEFINE(rpc_server)  ·  gpio_pin_set_dt(irq) on enqueue</text>


<!-- ================================================================ -->
<!-- ZEPHYR — SPI SLAVE                                                -->
<!-- ================================================================ -->

<rect x="672" y="468" width="506" height="92" rx="7"
      fill="#082a12" stroke="#105028" stroke-width="2"/>
<text x="925" y="496" text-anchor="middle" font-size="14" font-weight="bold" fill="#d0f0e0">SPI Slave Driver</text>
<text x="925" y="515" text-anchor="middle" font-size="11" fill="#80d0a0">Zephyr SPI subsystem  ·  CONFIG_SPI_SLAVE</text>
<text x="800" y="535" text-anchor="middle" font-size="10" fill="#60b080">spi_transceive()  512 B</text>
<text x="1050" y="535" text-anchor="middle" font-size="10" fill="#60b080">full-duplex TX+RX buffer</text>

<!-- IRQ GPIO note -->
<rect x="672" y="580" width="506" height="62" rx="7"
      fill="#040e08" stroke="#0e3a18" stroke-width="1" stroke-dasharray="4,3"/>
<text x="925" y="601" text-anchor="middle" font-size="11" font-weight="bold" fill="#409858">IRQ GPIO  (active high, output)</text>
<text x="925" y="619" text-anchor="middle" font-size="10" fill="#2a6838">gpio_pin_set_dt(1) on enqueue  ·  gpio_pin_set_dt(0) when queue drained</text>


<!-- ================================================================ -->
<!-- ZEPHYR — VERTICAL ARROWS                                          -->
<!-- ================================================================ -->

<!-- Real modules → RPC Handlers -->
<line x1="799" y1="182" x2="799" y2="214"
      stroke="#289048" stroke-width="1.5" marker-end="url(#ah-g)"/>

<!-- RPC Handlers → RPC Server -->
<line x1="925" y1="306" x2="925" y2="324"
      stroke="#289048" stroke-width="1.5" marker-end="url(#ah-g)"/>

<!-- RPC Server → SPI Slave -->
<line x1="925" y1="448" x2="925" y2="466"
      stroke="#289048" stroke-width="1.5" marker-end="url(#ah-g)"/>

<!-- SPI Slave → IRQ GPIO -->
<line x1="925" y1="560" x2="925" y2="578"
      stroke="#289048" stroke-width="1.5" marker-end="url(#ah-g)"/>


<!-- ================================================================ -->
<!-- PHYSICAL BUS CONNECTIONS                                          -->
<!-- ================================================================ -->

<!--
  Key y-positions:
    Linux SPI Master box:  y=550..642   → right-edge center: (538, 596)
    Zephyr SPI Slave box:  y=468..560   → left-edge  center: (672, 514)
    IRQ GPIO note:         y=580..642   → left-edge  center: (672, 611)

  SPI TX (Linux → Device):  (538,588) → bent at x=562 → (672,506)
  SPI RX (Device → Linux):  (672,522) → bent at x=562 → (538,604)
  IRQ   (Device → Linux):   (672,611) → bent at x=562 → (538,630)
-->

<!-- SPI TX: Linux → Zephyr (upper orange line) -->
<path d="M 538 588 H 562 V 506 H 672"
      fill="none" stroke="#c07818" stroke-width="2.5"
      marker-end="url(#ah-spi)"/>

<!-- SPI RX: Zephyr → Linux (lower orange line) -->
<path d="M 672 522 H 562 V 604 H 538"
      fill="none" stroke="#c07818" stroke-width="2.5"
      marker-end="url(#ah-spi)"/>

<!-- IRQ GPIO: Zephyr → Linux (red line) -->
<path d="M 672 611 H 562 V 630 H 538"
      fill="none" stroke="#b83030" stroke-width="2.5"
      marker-end="url(#ah-irq)"/>

<!-- SPI label block in the physical strip -->
<text x="600" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#c07818">SPI  8 MHz</text>
<text x="600" y="496" text-anchor="middle" font-size="9"  fill="#806018">CPOL=0  CPHA=0  MSB-first</text>
<text x="600" y="512" text-anchor="middle" font-size="9"  fill="#806018">MOSI · MISO · SCLK · CS</text>
<text x="600" y="528" text-anchor="middle" font-size="9"  fill="#806018">512 B/frame · full-duplex</text>

<!-- Separator tick between SPI and IRQ labels -->
<line x1="556" y1="538" x2="644" y2="538" stroke="#2a2a2a" stroke-width="1"/>

<!-- IRQ label in the physical strip -->
<text x="600" y="556" text-anchor="middle" font-size="11" font-weight="bold" fill="#b83030">IRQ GPIO</text>
<text x="600" y="572" text-anchor="middle" font-size="9"  fill="#783030">active high · rising edge</text>
<text x="600" y="588" text-anchor="middle" font-size="9"  fill="#783030">asserted by device</text>


