<text x="925" y="63" text-anchor="middle" font-size="10" fill="#408858"
      letter-spacing="2">REAL MODULE IMPLEMENTATIONS</text>

<!-- Radio Scheduler -->
<rect x="682" y="70" width="234" height="112" rx="7"
