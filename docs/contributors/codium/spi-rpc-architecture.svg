<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">

<defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Blue arrow (Linux internal flows) -->
  <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a82c8"/>
  </marker>

  <!-- Green arrow (Zephyr internal flows) -->
  <marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#3a9858"/>
  </marker>

  <!-- Orange arrow (SPI) -->
  <marker id="ah-spi" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#d08820"/>
  </marker>

  <!-- Red arrow (IRQ GPIO) -->
  <marker id="ah-irq" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#d04040"/>
  </marker>
</defs>


<!-- ================================================================ -->
<!-- PANEL BACKGROUNDS                                                 -->
<!-- ================================================================ -->

<!-- Linux panel -->
<rect x="8" y="8" width="534" height="824" rx="14"
      fill="#0c1e3c" stroke="#2a5898" stroke-width="2.5"/>

<!-- Physical strip -->
<rect x="546" y="8" width="108" height="824" rx="0" fill="#0a0a0a"/>

<!-- Zephyr panel -->
<rect x="658" y="8" width="534" height="824" rx="14"
      fill="#0c221a" stroke="#1e6030" stroke-width="2.5"/>


<!-- ================================================================ -->
<!-- PANEL TITLES                                                      -->
<!-- ================================================================ -->

<text x="275" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0d8f8">Linux Host</text>
<text x="925" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#b0e0c0">Zephyr Device  (nRF91x1)</text>

<!-- Physical strip title -->
<text x="600" y="30" text-anchor="middle" font-size="9" fill="#444444"
      font-weight="bold" letter-spacing="2">PHYSICAL</text>


<!-- ================================================================ -->
<!-- LINUX — USERSPACE AREA                                            -->
<!-- ================================================================ -->

<rect x="22" y="45" width="506" height="150" rx="8"
      fill="#132240" stroke="#22487a" stroke-width="1" stroke-dasharray="5,3"/>
<text x="275" y="63" text-anchor="middle" font-size="10" fill="#507898"
      letter-spacing="3">USERSPACE</text>

<!-- IPv6 Applications -->
<rect x="32" y="70" width="225" height="112" rx="7"
      fill="#1a4585" stroke="#3068b8" stroke-width="1.5"/>
<text x="144" y="96"  text-anchor="middle" font-size="13" font-weight="bold" fill="#ddeeff">IPv6 Applications</text>
<text x="144" y="114" text-anchor="middle" font-size="10" fill="#8ab2e0">POSIX socket API</text>
<text x="144" y="130" text-anchor="middle" font-size="10" fill="#8ab2e0">ping6 · curl · custom apps</text>
<text x="144" y="147" text-anchor="middle" font-size="9"  fill="#5a80b0">no DECT NR awareness</text>

<!-- Management Tools -->
<rect x="270" y="70" width="248" height="112" rx="7"
      fill="#1a4585" stroke="#3068b8" stroke-width="1.5"/>
<text x="394" y="96"  text-anchor="middle" font-size="13" font-weight="bold" fill="#ddeeff">Management Tools</text>
<text x="394" y="114" text-anchor="middle" font-size="10" fill="#8ab2e0">ip link · ip -6 addr · ip -6 route</text>
<text x="394" y="130" text-anchor="middle" font-size="10" fill="#8ab2e0">opener-ctl  (OPENER genl family)</text>
<text x="394" y="147" text-anchor="middle" font-size="9"  fill="#5a80b0">stats · channel config</text>


<!-- ================================================================ -->
<!-- USER/KERNEL BOUNDARY                                              -->
<!-- ================================================================ -->

<line x1="28" y1="207" x2="522" y2="207"
      stroke="#1e4070" stroke-width="1" stroke-dasharray="7,4"/>
<text x="275" y="204" text-anchor="middle" font-size="9" fill="#406890"
      letter-spacing="1">── ── ── user / kernel boundary ── ── ──</text>


<!-- ================================================================ -->
<!-- LINUX — KERNEL COMPONENTS                                         -->
<!-- ================================================================ -->

<!-- IPv6 Stack -->
<rect x="32" y="216" width="225" height="72" rx="7"
      fill="#103270" stroke="#2050a0" stroke-width="1.5"/>
<text x="144" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#ddeeff">IPv6 Stack</text>
<text x="144" y="258" text-anchor="middle" font-size="10" fill="#8ab2e0">routing · netfilter · tc</text>
<text x="144" y="274" text-anchor="middle" font-size="9"  fill="#5a80b0">BPF · standard kernel</text>

<!-- Generic Netlink -->
<rect x="270" y="216" width="248" height="72" rx="7"
      fill="#103270" stroke="#2050a0" stroke-width="1.5"/>
<text x="394" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#ddeeff">Generic Netlink</text>
<text x="394" y="258" text-anchor="middle" font-size="10" fill="#8ab2e0">family  "OPENER"</text>
<text x="394" y="274" text-anchor="middle" font-size="9"  fill="#5a80b0">opener_netlink.c</text>

<!-- net_device -->
<rect x="32" y="308" width="506" height="90" rx="7"
      fill="#0c2a60" stroke="#1c4890" stroke-width="2"/>
<text x="285" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#ddeeff">net_device  "opener0"</text>
<text x="285" y="355" text-anchor="middle" font-size="11" fill="#8ab2e0">opener_netdev.c  ·  MTU 1280  ·  ARPHRD_NONE  ·  IFF_NOARP</text>
<text x="152" y="377" text-anchor="middle" font-size="10" fill="#6898d0">ndo_start_xmit → TX work</text>
<text x="418" y="377" text-anchor="middle" font-size="10" fill="#6898d0">netif_rx ← RX work</text>

<!-- RPC Transport -->
<rect x="32" y="418" width="506" height="112" rx="7"
      fill="#08204e" stroke="#183c78" stroke-width="2"/>
<text x="285" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#ddeeff">RPC Transport</text>
<text x="285" y="465" text-anchor="middle" font-size="11" fill="#8ab2e0">opener_rpc.c</text>
<text x="120" y="485" text-anchor="middle" font-size="10" fill="#6898d0">frame_build()</text>
<text x="285" y="485" text-anchor="middle" font-size="10" fill="#6898d0">process_frame()</text>
<text x="452" y="485" text-anchor="middle" font-size="10" fill="#6898d0">crc16_ccitt()</text>
<text x="152" y="506" text-anchor="middle" font-size="10" fill="#4a78b0">opener_tx_work</text>
<text x="418" y="506" text-anchor="middle" font-size="10" fill="#4a78b0">opener_rx_work</text>

<!-- SPI Master -->
<rect x="32" y="550" width="506" height="92" rx="7"
      fill="#061530" stroke="#122858" stroke-width="2"/>
<text x="285" y="577" text-anchor="middle" font-size="14" font-weight="bold" fill="#ddeeff">SPI Master Driver</text>
<text x="285" y="596" text-anchor="middle" font-size="11" fill="#8ab2e0">opener_main.c  ·  Linux SPI subsystem</text>
<text x="144" y="617" text-anchor="middle" font-size="10" fill="#6898d0">spi_sync()</text>
<text x="395" y="617" text-anchor="middle" font-size="10" fill="#6898d0">request_irq() → queue_work(rx)</text>

<!-- Module Proxies (dashed box) -->
<rect x="32" y="662" width="506" height="74" rx="7"
      fill="#04101e" stroke="#183050" stroke-width="1" stroke-dasharray="5,3"/>
<text x="285" y="683" text-anchor="middle" font-size="12" font-weight="bold" fill="#4870a0">Module Proxies  (kernel,  struct opener_&lt;m&gt;_ops)</text>
<text x="285" y="701" text-anchor="middle" font-size="10" fill="#304868">opener_scheduler.c · opener_spectrum.c · opener_assoc.c · ...</text>
<text x="285" y="718" text-anchor="middle" font-size="9"  fill="#243858">same struct-of-fn-ptrs interface — callers unaware of RPC transport</text>


<!-- ================================================================ -->
<!-- LINUX — VERTICAL ARROWS                                           -->
<!-- ================================================================ -->

<!-- IPv6 Apps → IPv6 Stack -->
<line x1="144" y1="182" x2="144" y2="214"
      stroke="#2c5890" stroke-width="1.5" marker-end="url(#ah-b)"/>

<!-- Mgmt Tools → Genl -->
<line x1="394" y1="182" x2="394" y2="214"
      stroke="#2c5890" stroke-width="1.5" marker-end="url(#ah-b)"/>

<!-- IPv6 Stack → net_device (data path) -->
<line x1="144" y1="288" x2="144" y2="306"
      stroke="#2c5890" stroke-width="1.5" marker-end="url(#ah-b)"/>
<text x="158" y="302" font-size="9" fill="#4068a0">sk_buff</text>

<!-- Genl ⟶ RPC Transport (right-side bypass, dashed = management path) -->
<line x1="490" y1="288" x2="490" y2="416"
      stroke="#2c5890" stroke-width="1.5" stroke-dasharray="4,2.5" marker-end="url(#ah-b)"/>
<text x="510" y="360" font-size="9" fill="#3860a0"
      transform="rotate(90 510 360)">management</text>

<!-- net_device → RPC Transport -->
<line x1="200" y1="398" x2="200" y2="416"
      stroke="#2c5890" stroke-width="1.5" marker-end="url(#ah-b)"/>

<!-- RPC Transport → SPI Master -->
<line x1="285" y1="530" x2="285" y2="548"
      stroke="#2c5890" stroke-width="1.5" marker-end="url(#ah-b)"/>


<!-- ================================================================ -->
<!-- ZEPHYR — REAL MODULE IMPLEMENTATIONS                              -->
<!-- ================================================================ -->

<rect x="672" y="45" width="506" height="150" rx="8"
