[project]
name = "opender-specification"
version = "0.1.0"
description = "This repository contains functional and technical specification documents of the Opener Initiative's **DECT-2020 NR (DECT NR+)** protocol stack implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esbonio>=2.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "attrs>=24.3.0",
    "cattrs>=23.1.2",
    "lsprotocol==2025.0.0",
]

[dependency-groups]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=2.0",
    "sphinx>=7.1.2",
    "sphinx-design>=0.5.0",
]

[tool.esbonio.sphinx]
pythonCommand = ["uv", "run", "python"]
buildCommand  = ["sphinx-build", "-M", "html", "docs", "${defaultBuildDir}"]

[tool.esbonio.preview]
bind = "127.0.0.1"

[tool.esbonio.server]
logLevel = "warning"